# Checks the things that can be checked without timing anything.
#
# Deliberately does not run the benchmark - see pages.yml for why CI is the wrong
# place to measure. This only proves the app builds and the harness typechecks, so
# a broken matrix or a broken app is caught before someone spends 45 minutes on a
# run that was never going to be valid.
name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned through .nvmrc so CI and local development cannot drift. Angular 22
      # requires ^22.22.3, and a 22.22.2 runner fails at install rather than at
      # build, which is a confusing place to discover a version floor.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm --prefix app ci

      - name: Typecheck harness and scenarios
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build the application
        run: npm run app:build

      - name: Analysis scripts parse
        run: |
          for f in analysis/*.mjs tools/*.mjs; do node --check "$f"; done

      # results/composition.json is committed, so this regenerates the document
      # from the same proofs the published page shows.
      - name: Composition document regenerates and matches what is committed
        run: |
          npm run composition-doc
          git diff --exit-code docs/LOCATOR-COMPOSITION.md \
            || { echo "::error::docs/LOCATOR-COMPOSITION.md is stale. Run 'npm run composition-doc' and commit."; exit 1; }

      - name: Test-level matrix regenerates and matches what is committed
        run: |
          npm run matrix-doc
          git diff --exit-code docs/ACCESSIBILITY-AND-TEST-LEVELS.md \
            || { echo "::error::The matrix in docs/ACCESSIBILITY-AND-TEST-LEVELS.md is stale. Run 'npm run matrix-doc' and commit."; exit 1; }

      # The matrix and patterns pages are rebuilt here rather than taken from the
      # repository: their links are derived from the current branch, so a committed
      # copy and a fresh one legitimately differ and cannot be compared. The dashboard is checked as
      # committed, since rebuilding it needs a benchmark run. Chromium only - these
      # are static pages and a second engine would double the install for nothing.
      - name: Generated pages render, and their popovers behave
        run: |
          npx playwright install --with-deps chromium
          npm run accessibility-page
          npm run patterns-page
          npm run verify:pages

      - name: Strategy reference regenerates and matches what is committed
        run: |
          npm run reference
          git diff --exit-code docs/LOCATOR-REFERENCE.md \
            || { echo "::error::docs/LOCATOR-REFERENCE.md is stale. Run 'npm run reference' and commit."; exit 1; }
