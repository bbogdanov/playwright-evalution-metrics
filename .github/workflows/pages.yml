name: Deploy to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm --prefix app ci

      # The Angular app is published at <site>/app/ so the pages under test can be
      # inspected live. base_path is "/<repo>" on a project site and "" on a custom
      # domain, so the base href follows wherever Pages actually serves the site.
      - name: Build the application into the site
        env:
          BM_APP_BASE: ${{ steps.pages.outputs.base_path }}/app/
        run: npm run app:pages

      # The site bar links the app only when app/index.html sits next to the page,
      # so the pages are regenerated now that it does. Every input is committed and
      # a regeneration without the app is byte-identical to the committed pages;
      # nothing here re-runs the benchmark.
      - name: Regenerate the pages with the application linked
        run: |
          npm run accessibility-page
          npm run patterns-page
          npm run deep-page
          npm run dashboard

      # Uploaded as is, without Jekyll: the pages and the app bundle are finished
      # files, and Jekyll would only drop anything whose name starts with "_".
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./results/dashboard

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
